name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/nativehub-3

            # Pull latest
            git fetch origin main
            git reset --hard origin/main

            # Build and deploy
            docker compose -f docker/docker-compose.yml pull
            docker compose -f docker/docker-compose.yml build --no-cache

            # Deploy with zero-downtime (recreate one service at a time)
            docker compose -f docker/docker-compose.yml up -d --no-deps --force-recreate api
            sleep 10  # Wait for API health check
            docker compose -f docker/docker-compose.yml up -d --no-deps --force-recreate web

            # Cleanup
            docker image prune -f

      - name: Verify deployment
        run: |
          for i in {1..30}; do
            if curl -sf https://api.nativehub.arakakileo.com/health | grep -q '"status":"ok"'; then
              echo "Deployment successful!"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 5
          done
          echo "Health check failed!"
          exit 1
