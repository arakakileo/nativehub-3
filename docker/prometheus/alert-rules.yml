# Alert rules for NativeHub 3.0
groups:
  - name: nativehub-alerts
    rules:
      # High Error Rate Alert
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(nativehub_http_errors_total[5m])) /
            sum(rate(nativehub_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # High Latency Alert (p95 > 1s)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(nativehub_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is {{ $value | humanizeDuration }} (threshold: 1s)"

      # Service Down Alert
      - alert: NativeHubApiDown
        expr: up{job="nativehub-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NativeHub API is down"
          description: "NativeHub API has been unreachable for more than 1 minute"

      # High Memory Usage Alert
      - alert: HighMemoryUsage
        expr: |
          (
            nativehub_nodejs_heap_size_used_bytes /
            nativehub_nodejs_heap_size_total_bytes
          ) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Heap usage is {{ $value | humanizePercentage }} (threshold: 80%)"

      # Too Many Active Requests
      - alert: TooManyActiveRequests
        expr: nativehub_http_active_requests > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High number of active requests"
          description: "{{ $value }} active requests (threshold: 100)"

      # Slow Database Queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            sum(rate(nativehub_db_query_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile DB query time is {{ $value | humanizeDuration }}"

      # Job Processing Failures
      - alert: JobProcessingFailures
        expr: |
          sum(rate(nativehub_jobs_processed_total{status="failed"}[15m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Job processing failures detected"
          description: "Job failure rate: {{ $value }} per second"
