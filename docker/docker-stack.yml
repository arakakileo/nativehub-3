version: '3.8'

services:
  api:
    image: nativehub3-api:latest
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        # HTTPS router
        - traefik.http.routers.nativehub3-api.rule=Host(`api-nativehub.arakakileo.com`)
        - traefik.http.routers.nativehub3-api.entrypoints=websecure
        - traefik.http.routers.nativehub3-api.tls=true
        - traefik.http.routers.nativehub3-api.tls.certresolver=letsencrypt
        # Service port
        - traefik.http.services.nativehub3-api.loadbalancer.server.port=3001
        # HTTP redirect
        - traefik.http.routers.nativehub3-api-http.rule=Host(`api-nativehub.arakakileo.com`)
        - traefik.http.routers.nativehub3-api-http.entrypoints=web
        - traefik.http.routers.nativehub3-api-http.middlewares=redirect-to-https@docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - traefik-public
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nativehub3-web:latest
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        # HTTPS router
        - traefik.http.routers.nativehub3-web.rule=Host(`nativehub.arakakileo.com`)
        - traefik.http.routers.nativehub3-web.entrypoints=websecure
        - traefik.http.routers.nativehub3-web.tls=true
        - traefik.http.routers.nativehub3-web.tls.certresolver=letsencrypt
        # Service port
        - traefik.http.services.nativehub3-web.loadbalancer.server.port=80
        # HTTP redirect
        - traefik.http.routers.nativehub3-web-http.rule=Host(`nativehub.arakakileo.com`)
        - traefik.http.routers.nativehub3-web-http.entrypoints=web
        - traefik.http.routers.nativehub3-web-http.middlewares=redirect-to-https@docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik-public

  # ==========================================
  # Monitoring Stack
  # ==========================================

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.26.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager:9093'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.2.2
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER required}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana-nativehub.arakakileo.com
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        # HTTPS router
        - traefik.http.routers.nativehub3-grafana.rule=Host(`grafana-nativehub.arakakileo.com`)
        - traefik.http.routers.nativehub3-grafana.entrypoints=websecure
        - traefik.http.routers.nativehub3-grafana.tls=true
        - traefik.http.routers.nativehub3-grafana.tls.certresolver=letsencrypt
        # Service port
        - traefik.http.services.nativehub3-grafana.loadbalancer.server.port=3000
        # HTTP redirect
        - traefik.http.routers.nativehub3-grafana-http.rule=Host(`grafana-nativehub.arakakileo.com`)
        - traefik.http.routers.nativehub3-grafana-http.entrypoints=web
        - traefik.http.routers.nativehub3-grafana-http.middlewares=redirect-to-https@docker
    networks:
      - traefik-public
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-public:
    external: true
  monitoring:
    driver: overlay

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
