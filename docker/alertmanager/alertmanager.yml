# AlertManager configuration for NativeHub 3.0
global:
  resolve_timeout: 5m

# Route tree configuration
route:
  # Default receiver
  receiver: 'discord-notifications'

  # Group alerts by alertname
  group_by: ['alertname', 'severity']

  # Wait time before sending first notification
  group_wait: 30s

  # Wait time before sending notification about new alerts in a group
  group_interval: 5m

  # Wait time before resending a notification
  repeat_interval: 4h

  # Child routes for severity-based routing
  routes:
    # Critical alerts go immediately
    - match:
        severity: critical
      receiver: 'discord-critical'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'discord-notifications'
      group_wait: 1m
      repeat_interval: 4h

# Inhibition rules to suppress redundant alerts
inhibit_rules:
  # If service is down, suppress other alerts from that service
  - source_match:
      alertname: 'NativeHubApiDown'
    target_match_re:
      alertname: 'High.*'
    equal: ['job']

# Notification receivers
receivers:
  # Discord webhook for critical alerts
  - name: 'discord-critical'
    webhook_configs:
      - url: '${DISCORD_WEBHOOK_URL}'
        send_resolved: true
        http_config:
          follow_redirects: true

  # Discord webhook for all notifications
  - name: 'discord-notifications'
    webhook_configs:
      - url: '${DISCORD_WEBHOOK_URL}'
        send_resolved: true
        http_config:
          follow_redirects: true

# Templates for alert formatting (optional)
templates:
  - '/etc/alertmanager/templates/*.tmpl'
